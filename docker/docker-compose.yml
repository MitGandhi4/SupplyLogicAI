version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: supplymind-api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../mlflow:/app/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: supplymind-dashboard
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: supplymind-mlflow
    working_dir: /app
    volumes:
      - ../mlflow:/app/mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.14.1 &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri file:///app/mlflow/mlruns
               --default-artifact-root file:///app/mlflow/mlartifacts"
    ports:
      - "5000:5000"
    restart: unless-stopped

networks:
  default:
    name: supplymind-network
